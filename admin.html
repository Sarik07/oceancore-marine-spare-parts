<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | OceanCore</title><link rel="stylesheet" href="assets/css/style.css"><style>.admin{padding:45px 0;background:#f5f9fb;min-height:100vh}.box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:25px;margin-bottom:20px}.login{max-width:430px;margin:10vh auto}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.adminnav button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:6px;font-weight:800;cursor:pointer}.adminnav button.active{background:var(--navy);color:#fff}.tab{display:none}.tab.active{display:block}.aform{display:grid;grid-template-columns:1fr 1fr;gap:14px}.aform .full{grid-column:1/-1}.aform label{font-size:11px;font-weight:800}.aform input,.aform select,.aform textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:6px;font:inherit}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.thumb{width:50px;height:40px;object-fit:contain;background:#eef5f8}.actions{display:flex;gap:6px}.small{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:5px;font-weight:800;cursor:pointer}.danger{color:#a7251d}.msg{padding:10px;background:#edf8f1;border-radius:6px;margin-bottom:15px;font-size:12px}.hidden{display:none!important}@media(max-width:700px){.aform{grid-template-columns:1fr}.aform .full{grid-column:auto}}</style></head><body><div id="login"><div class="container"><div class="box login"><div class="brand"><span class="brand-mark">OC</span><span>OceanCore<small>ADMIN PANEL</small></span></div><h1>Admin Login</h1><div id="loginMsg" class="msg hidden"></div><form id="loginForm"><label>Email<input type="email" name="email" required></label><br><label>Password<input type="password" name="password" required></label><br><button class="btn btn-primary" style="width:100%">Sign In</button></form></div></div></div>
<div id="app" class="hidden"><header class="header"><div class="container nav"><div class="brand"><span class="brand-mark">OC</span><span>OceanCore<small>PRODUCT ADMIN</small></span></div><button id="logout" class="small">Logout</button></div></header><main class="admin"><div class="container"><div id="msg" class="msg hidden"></div><div class="adminnav"><button class="active" data-tab="products">Products</button><button data-tab="categories">Categories</button><button data-tab="brands">Brands</button><button data-tab="quotes">Quote Requests</button></div>
<section id="products" class="tab active"><div class="box"><h2 id="ptitle">Add Product</h2><form id="productForm" class="aform"><input type="hidden" name="id"><label>Product Name *<input name="product_name" required></label><label>Category *<select name="category_id" id="catSelect" required></select></label><label>Brand<select name="brand_id" id="brandSelect"><option value="">No brand</option></select></label><label>Part Number<input name="part_number"></label><label class="full">Product Image<input type="file" name="image" accept="image/*"></label><label class="full">Short Description<textarea name="short_description" rows="3"></textarea></label><label><input type="checkbox" name="featured"> Featured on homepage</label><label><input type="checkbox" name="active" checked> Active</label><div class="full"><button class="btn btn-primary">Save Product</button> <button type="button" id="cancel" class="small hidden">Cancel Edit</button></div></form></div><div class="box"><h2>Products</h2><div class="tablewrap"><table class="table"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Brand</th><th>Part No.</th><th>Actions</th></tr></thead><tbody id="productTable"></tbody></table></div></div></section>
<section id="categories" class="tab"><div class="box"><h2>Add Category</h2><form id="categoryForm" class="aform"><label>Name *<input name="name" required></label><div></div><label class="full">Description<textarea name="description" rows="2"></textarea></label><div class="full"><button class="btn btn-primary">Add Category</button></div></form></div><div class="box"><table class="table"><thead><tr><th>Name</th><th>Actions</th></tr></thead><tbody id="categoryTable"></tbody></table></div></section>
<section id="brands" class="tab"><div class="box"><h2>Add Brand</h2><form id="brandForm"><label style="font-size:11px;font-weight:800">Brand Name *<input name="name" required style="display:block;width:100%;margin:7px 0 14px;padding:11px;border:1px solid var(--line);border-radius:6px"></label><button class="btn btn-primary">Add Brand</button></form></div><div class="box"><table class="table"><thead><tr><th>Brand</th><th>Actions</th></tr></thead><tbody id="brandTable"></tbody></table></div></section>
<section id="quotes" class="tab"><div class="box"><h2>Quote Requests</h2><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Product</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody id="quoteTable"></tbody></table></div></div></section>
</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/admin.js"></script></body></html>
